parser_requirements:
  - Select an exact row inside a qualified table/section, not by document-wide label alone.
  - Select an explicit zero-based value_index after numeric-cell normalization.
  - Preserve raw parenthetical signs and em dashes in evidence before controlled sign normalization.
  - Resolve period_type from the recipe; never publish YTD roll-forward rows as standalone quarters.
  - Reconcile every roll-forward exactly as beginning + acquired + additions - sales + valuation change - realization = ending; quarantine any residual.
  - For 2026 Q1 and Q2, do not synthesize an absent Sales row; no msr_sales observation exists for those cells.

