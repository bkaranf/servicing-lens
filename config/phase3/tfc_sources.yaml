derived_recipes:
  - metric_id: msr_fair_value_multiple_of_related_upb
    formula_version: "1.0.0"
    formula: msr_fair_value / servicing_for_others_upb
    output_unit: multiple
    quantize: "0.000001"
    rounding: ROUND_HALF_EVEN
    require_same_instant_period: true
    require_published_input_observation_ids: true
  - metric_id: msr_fair_value_bps_of_related_upb
    formula_version: "1.0.0"
    formula: (msr_fair_value / servicing_for_others_upb) * 10000
    output_unit: basis_points
    quantize: "0.01"
    rounding: ROUND_HALF_EVEN
    require_same_instant_period: true
    require_published_input_observation_ids: true
