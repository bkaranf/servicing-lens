excluded_candidates:
  - metric_id: delinquency_30_plus_count_rate
    candidate: "30-89 days, 60 days, and 90 days or more tables"
    reason: "The periodic filing dollar buckets are UPB-weighted, not count-weighted; they cannot publish a count-rate metric."
  - metric_id: delinquency_90_plus_count_rate
    candidate: "90 days or more"
    reason: "The source discloses UPB, not a 90+ loan-count rate."
  - metric_id: msr_fair_value_market_change
    candidate: "Changes in inputs used in valuation model"
    reason: "The issuer combines rate, OAS/pricing-spread, cost, and other valuation inputs; it does not isolate market movement."
  - metric_id: msr_fair_value_assumption_change
    candidate: "Changes in inputs used in valuation model"
    reason: "The issuer does not isolate assumption-only change from its combined valuation-input change."
  - metric_id: gnma_servicing_upb
    candidate: "Government insured or guaranteed"
    reason: "The source says the population includes Ginnie Mae pools and private-investor loans; GNMA UPB is not isolated."
  - metric_id: cost_to_service_per_loan
    candidate: "Per-loan annual cost of servicing"
    reason: "This is an MSR valuation input, not reported operating expense per serviced loan; the governed output uses published expense and counts instead."

