# The following mapping recipes are deterministic instructions, never configured
# authoritative numeric observations. `value_indices`, `table_anchor`, and
# `column_headers` are explicit parser qualifiers.
recipes:
  q2_release_five_quarter_table:
    source_key: pfsi_2026q2_earnings
    table_anchor: "Servicing Segment Profitability and Key Metrics"
    column_headers: ["2Q26", "1Q26", "4Q25", "3Q25", "2Q25"]
    periods: ["2025-09-30", "2025-12-31", "2026-03-31", "2026-06-30"]
    value_indices: [3, 2, 1, 0]
    period_value_indices:
      "2025-09-30": 3
      "2025-12-31": 2
      "2026-03-31": 1
      "2026-06-30": 0
    rows:
      - {metric_id: servicing_revenue, raw_label: "Net revenues", row_occurrence: -1, unit: USD, scale: "1000000", normalization: usd_from_millions, methodology: GAAP_SERVICING_SEGMENT, reporting_scope_id: pfsi_servicing_segment}
      - {metric_id: servicing_fee_income, raw_label: "Total loan servicing fees", unit: USD, scale: "1000000", normalization: usd_from_millions, methodology: ISSUER_REPORTED_TOTAL_OWNED_AND_SUBSERVICING_FEES, reporting_scope_id: pfsi_servicing_segment}
      - {metric_id: ancillary_servicing_income, raw_label: "Ancillary and other fees", unit: USD, scale: "1000000", normalization: usd_from_millions, methodology: ISSUER_REPORTED_ANCILLARY_AND_OTHER, reporting_scope_id: pfsi_servicing_segment}
      - {metric_id: servicing_pretax_income, raw_label: "Servicing pretax income", row_occurrence: -1, unit: USD, scale: "1000000", normalization: usd_from_millions, methodology: GAAP_SERVICING_SEGMENT, reporting_scope_id: pfsi_servicing_segment}
      - {metric_id: servicing_adjusted_pretax_income, raw_label: "Servicing pretax income net of valuation related changes", unit: USD, scale: "1000000", normalization: usd_from_millions, methodology: ISSUER_REPORTED_NON_GAAP_RECONCILED, reporting_scope_id: pfsi_servicing_segment}
      - {metric_id: msr_realization_or_amortization, raw_label: "Realization of MSR cash flows", unit: USD, scale: "1000000", normalization: reduction_magnitude_from_parenthetical_millions, methodology: FAIR_VALUE_REALIZATION_OF_CASH_FLOWS, reporting_scope_id: pfsi_owned_msr_portfolio}
      - {metric_id: msr_fair_value_inputs_or_assumptions_change, raw_label: "Changes in MSR fair value due to changes in valuation inputs", unit: USD, scale: "1000000", normalization: signed_usd_from_millions, methodology: ISSUER_COMBINED_VALUATION_INPUT_CHANGE, reporting_scope_id: pfsi_owned_msr_portfolio}
      - {metric_id: msr_hedging_result, raw_label: "Hedging results", unit: USD, scale: "1000000", normalization: signed_usd_from_millions, methodology: ISSUER_REPORTED_MSR_HEDGE_RESULT, reporting_scope_id: pfsi_owned_msr_portfolio}
      - {metric_id: total_servicing_upb, raw_label: "Total UPB", unit: USD, scale: "1000000000", normalization: usd_from_billions, methodology: TOTAL_OWNED_MSR_SUBSERVICED_AND_HELD_FOR_SALE, reporting_scope_id: pfsi_total_servicing_portfolio}
      - {metric_id: subservicing_upb, raw_label: "Subserviced UPB", unit: USD, scale: "1000000000", normalization: usd_from_billions, methodology: PMT_AND_OTHER_SUBSERVICING, reporting_scope_id: pfsi_subservicing_portfolio}
      - {metric_id: servicing_loan_count, raw_label: "Total loans serviced (in thousands)", unit: count, scale: "1000", normalization: count_from_thousands, methodology: TOTAL_SERVICING_PORTFOLIO_COUNT, reporting_scope_id: pfsi_total_servicing_portfolio}
      - {metric_id: delinquency_60_plus_count_rate, raw_label: "60+ Day Delinquency", unit: percent, scale: "0.01", normalization: percent_to_ratio, methodology: ISSUER_REPORTED_LOAN_COUNT_OWNED_PORTFOLIO, reporting_scope_id: pfsi_owned_msr_portfolio, dimensions: {portfolio_population: owned_msr}}
      - {metric_id: weighted_average_servicing_fee_bps, raw_label: "Weighted average servicing fee", unit: basis_points, scale: "1", normalization: percent_to_basis_points, methodology: ISSUER_REPORTED_OWNED_MSR_RATE, reporting_scope_id: pfsi_owned_msr_portfolio, dimensions: {portfolio_population: owned_msr}}

  periodic_msr_fair_value_and_related_upb:
    reporting_scope_id: pfsi_owned_msr_portfolio
    unit: USD
    scale: "1000"
    table_anchor: "Mortgage servicing rights and mortgage servicing liabilities"
    column_headers: ["Unpaid principal balance of underlying loans", "Fair value"]
    by_period:
      "2025-09-30": {source_key: pfsi_2025q3_10q}
      "2025-12-31": {source_key: pfsi_2025q4_10k}
      "2026-03-31": {source_key: pfsi_2026q1_10q}
      "2026-06-30": {source_key: pfsi_2026q2_10q}
    rows:
      - {metric_id: owned_msr_upb, raw_label: "Unpaid principal balance of underlying loans", normalization: usd_from_thousands, methodology: RELATED_LOANS_UNDERLYING_RECOGNIZED_MSR_FAIR_VALUE}
      - {metric_id: msr_fair_value, raw_label: "Fair value", normalization: usd_from_thousands, methodology: FAIR_VALUE}

  presentation_operating_expense:
    table_anchor: "SERVICING PROFITABILITY EXCLUDING VALUATION-RELATED CHANGES"
    parser_behavior: "The filed presentation serializes each slide as one table cell. Tokenize normalized visible slide text after the anchor, select the Operating expenses sequence under the stated quarter headers, and retain the exact parenthetical source token before sign normalization."
    current_stage_a_row_parser_compatible: false
    raw_label: "Operating expenses"
    unit: USD
    scale: "1000000"
    normalization: expense_magnitude_from_millions
    methodology: ISSUER_REPORTED_DIRECT_SERVICING_OPERATING_EXPENSE
    reporting_scope_id: pfsi_servicing_segment
    by_period:
      "2025-09-30": {source_key: pfsi_2025q3_presentation, column_headers: ["3Q25", "$ in millions"], reported_decimals: 1}
      "2025-12-31": {source_key: pfsi_2025q4_presentation, column_headers: ["4Q25", "$ in millions"], reported_decimals: 1}
      "2026-03-31": {source_key: pfsi_2026q1_presentation, column_headers: ["1Q26", "$ in millions"], reported_decimals: 1}
      "2026-06-30": {source_key: pfsi_2026q2_presentation, column_headers: ["2Q26", "$ in millions"], reported_decimals: 0}

  periodic_portfolio_and_delinquency:
    reporting_scope_id: pfsi_owned_msr_and_msl_portfolio
    unit: USD
    scale: "1000"
    dash_policy: PUBLISH_ZERO_ONLY_WHEN_ROW_PRESENTS_EM_DASH
    table_anchor: "Loan type | Unpaid principal balance | Loan count"
    column_headers: ["Unpaid principal balance", "Loan count", "60+ Delinquency (by UPB)"]
    by_period:
      "2025-09-30": {source_key: pfsi_2025q3_10q, total_row: 1763}
      "2025-12-31": {source_key: pfsi_2025q4_10k, total_row: 558}
      "2026-03-31": {source_key: pfsi_2026q1_10q, total_row: 1586}
      "2026-06-30": {source_key: pfsi_2026q2_10q, total_row: 1776}
    component_rows:
      government_servicing_upb:
        input_metric_ids: [fha_servicing_upb, va_servicing_upb, usda_servicing_upb]
        raw_labels: [FHA, VA, USDA]
        formula: "sum exact published component observations"
        methodology: DERIVED_ISSUER_GOVERNMENT_INSURED_OR_GUARANTEED
      conventional_servicing_upb:
        input_metric_ids: [fhlmc_servicing_upb, fnma_servicing_upb, closed_end_second_lien_servicing_upb, other_servicing_upb]
        raw_labels: ["Freddie Mac", "Fannie Mae", "Closed-end second lien mortgage loans", "Other (3)"]
        formula: "sum exact published component observations"
        methodology: DERIVED_ISSUER_CONVENTIONAL_COMPONENTS
      fhlmc_servicing_upb: {raw_label: "Freddie Mac", methodology: ISSUER_REPORTED_OWNED_MSR_INVESTOR_MIX}
      fnma_servicing_upb: {raw_label: "Fannie Mae", methodology: ISSUER_REPORTED_OWNED_MSR_INVESTOR_MIX}
      fha_servicing_upb: {raw_label: FHA, methodology: ISSUER_REPORTED_OWNED_MSR_INVESTOR_MIX}
      va_servicing_upb: {raw_label: VA, methodology: ISSUER_REPORTED_OWNED_MSR_INVESTOR_MIX}
      usda_servicing_upb: {raw_label: USDA, methodology: ISSUER_REPORTED_OWNED_MSR_INVESTOR_MIX}
      closed_end_second_lien_servicing_upb: {raw_label: "Closed-end second lien mortgage loans", methodology: ISSUER_REPORTED_OWNED_MSR_INVESTOR_MIX}
      other_servicing_upb: {raw_label: "Other (3)", methodology: ISSUER_REPORTED_OWNED_MSR_INVESTOR_MIX}
      owned_msr_msl_upb: {raw_label: Total, methodology: ISSUER_REPORTED_OWNED_MSR_AND_MSL_TOTAL}
    reconciliation:
      formula: government_components + conventional_components = source_reported_owned_msr_and_msl_upb
      scope_note: "The investor/loan-type table includes both recognized MSRs and MSLs; it is not the exact MSR-only denominator used for fair-value economics."
      tolerance: "0"
      failure_disposition: QUARANTINE

  periodic_msr_rollforward:
    unit: USD
    scale: "1000"
    reporting_scope_id: pfsi_owned_msr_portfolio
    table_anchor: "Balance at beginning of"
    by_period:
      "2025-09-30": {source_key: pfsi_2025q3_10q, column_headers: ["Quarter ended September 30", "2025"]}
      "2025-12-31": {source_key: pfsi_2025q4_10k, column_headers: ["Year ended December 31", "2025"]}
      "2026-03-31": {source_key: pfsi_2026q1_10q, column_headers: ["Quarter ended March 31", "2026"]}
      "2026-06-30": {source_key: pfsi_2026q2_10q, column_headers: ["Quarter ended June 30", "2026"]}
    rows:
      - {metric_id: msr_beginning_balance, raw_label_variants: ["Balance at beginning of period", "Balance at beginning of quarter", "Balance at beginning of year"], normalization: usd_from_thousands, sign: positive}
      - {metric_id: msr_additions, raw_label: "MSRs resulting from loan sales", normalization: usd_from_thousands, sign: positive}
      - metric_id: msr_sales
        raw_label: "Sales adjustments (sales) to:"
        component_labels: [Non-affiliates, "PennyMac Mortgage Investment Trust"]
        publication_policy: SOURCE_COMPONENTS_ONLY_NO_AGGREGATE_OBSERVATION
        rationale: "The source has component rows but no exact aggregate sales row; parser-local arithmetic is prohibited."
      - {metric_id: msr_fair_value_inputs_or_assumptions_change, raw_label: "Changes in inputs used in valuation model (1)", normalization: signed_usd_from_thousands, methodology: ISSUER_COMBINED_VALUATION_INPUT_CHANGE}
      - {metric_id: msr_realization_or_amortization, raw_label: "Other changes in fair value (2)", normalization: reduction_magnitude_from_thousands, methodology: FAIR_VALUE_REALIZATION_OF_CASH_FLOWS}
      - {metric_id: msr_ending_balance, raw_label_variants: ["Balance at end of period", "Balance at end of quarter", "Balance at end of year"], normalization: usd_from_thousands, sign: positive}
    reconciliation:
      formula: beginning + additions + other_sales_adjustment - sales + valuation_input_change - realization = ending
      tolerance: "0"
      failure_disposition: QUARANTINE

  derived_cost_to_service_per_loan:
    metric_id: cost_to_service_per_loan
    formula_version: "1.0.0"
    formula: "servicing_operating_expense / average(beginning_servicing_loan_count, ending_servicing_loan_count) * 365 / actual_period_days"
    methodology: DERIVED_ANNUALIZED_QUARTERLY_EXPENSE_PER_AVERAGE_LOAN
    required_inputs: [servicing_operating_expense, beginning_servicing_loan_count, ending_servicing_loan_count]
    input_observation_ids_required: true
    required_scope_alignment: pfsi_servicing_segment_to_total_servicing_portfolio
    averaging_convention: arithmetic_mean_of_exact_adjacent_quarter_end_counts
    annualization: ACTUAL_OVER_365
    period_days_by_period: {"2025-09-30": "92", "2025-12-31": "92", "2026-03-31": "90", "2026-06-30": "91"}
    annualization_basis_days: "365"
    output_unit: USD_per_loan
    rounding: ROUND_HALF_EVEN
    quantize: "0.01"
    zero_denominator: REJECT

  derived_msr_economics:
    reporting_scope_id: pfsi_owned_msr_portfolio
    input_observation_ids_required: true
    required_period_alignment: SAME_INSTANT_OR_DURATION_AS_APPLICABLE
    zero_denominator: REJECT
    recipes:
      - metric_id: msr_fair_value_multiple_of_related_upb
        formula_version: "1.0.0"
        formula: msr_fair_value / owned_msr_upb
        output_unit: multiple
        quantize: "0.000001"
        rounding: ROUND_HALF_EVEN
      - metric_id: msr_fair_value_bps_of_related_upb
        formula_version: "1.0.0"
        formula: (msr_fair_value / owned_msr_upb) * 10000
        output_unit: basis_points
        quantize: "0.01"
        rounding: ROUND_HALF_EVEN
      - metric_id: capitalized_servicing_rate_on_additions
        formula_version: "1.0.0"
        formula: msr_additions / msr_additions_related_upb
        denominator_metric_id: msr_additions_related_upb
        input_label: "Unpaid principal balance"
        input_table_anchor: "MSR and underlying loan characteristics"
        output_unit: basis_points
        quantize: "0.000001"
        rounding: ROUND_HALF_EVEN
        excluded_periods:
          "2025-12-31": "The 10-K reports only annual additions and related UPB, not standalone Q4 inputs."

  derived_owned_portfolio_delinquency:
    reporting_scope_id: pfsi_owned_msr_and_msl_portfolio
    input_observation_ids_required: true
    denominator_metric_id: owned_msr_msl_upb
    denominator_source_field: source_reported_owned_msr_and_msl_upb
    denominator_scope_note: "Use the exact total from the same MSR/MSL population table; do not substitute the MSR-only related-UPB field."
    source_table_anchor: "Delinquencies > Owned servicing"
    unit: ratio
    scale: "1"
    formulas:
      delinquency_30_plus_upb_rate: "(delinquency_30_to_89_upb + delinquency_90_plus_upb) / owned_msr_msl_upb"
      delinquency_90_plus_upb_rate: "delinquency_90_plus_upb / owned_msr_msl_upb"
      foreclosure_upb_rate: "foreclosure_upb / owned_msr_msl_upb"
    reported_mapping:
      metric_id: delinquency_60_plus_upb_rate
      table_anchor: "Loan type | Unpaid principal balance | Loan count"
      raw_label: "total row"
      column_header: "60+ Delinquency (by UPB)"
      normalization: percent_to_ratio
      methodology: ISSUER_REPORTED_UPB_WEIGHTED_OWNED_MSR_PORTFOLIO

# DERIVED means that the arithmetic candidate is reproducible from retained
# issuer text. It is not permission to publish unless every input is itself a
# canonical published observation with an observation ID.
