eligible_source_assessment:
  assessment_version: "1.0.0"
  expected_cells: 212
  classification_counts: {R: 31, D: 8, ND: 173, SOURCE_NOT_CHECKED: 0}
  cells:
    servicing_for_others_upb: {periods: *all_r, check_profile: portfolio, scope_id: wfc_consolidated_residential_mortgage_servicing, rationale: "Exact final residential loans-serviced-for-others UPB in each periodic filing; preliminary supplement reconciles at its disclosed rounding."}
    total_servicing_upb: {periods: *q3_q4_r, check_profile: portfolio, scope_id: wfc_managed_residential_mortgage_servicing, rationale: "Exact managed residential total in 2025; changed 2026 format does not disclose it."}
    owned_msr_upb: {periods: *all_nd, check_profile: portfolio, rationale: "No UPB explicitly limited to loans underlying owned residential MSRs; loans serviced for others is not relabeled."}
    servicing_loan_count: {periods: *all_nd, check_profile: portfolio, rationale: "No loan count for the disclosed residential servicing population."}
    subservicing_upb: {periods: *all_nd, check_profile: portfolio, rationale: "Third-party serviced excludes subservicing; rounded serviced-and-subserviced rows do not isolate an exact subservicing amount."}
    bank_owned_loans_serviced_upb: {periods: *q3_q4_r, check_profile: portfolio, scope_id: wfc_owned_residential_loans_serviced, rationale: "Exact 2025 residential Owned loans serviced row; absent after the 2026 Note 6 format change."}
    interim_servicing_upb: {periods: *all_nd, check_profile: portfolio, rationale: "No interim-servicing population disclosed."}
    servicing_revenue: {periods: *except_q4_r, check_profile: servicing_economics, scope_id: wfc_mortgage_banking_servicing_economics, rationale: "Exact Note 6 Total net servicing income for Q3/Q1/Q2; the preliminary Q4 Net servicing income boundary is not proven equivalent and is not substituted."}
    servicing_fee_income: {periods: *all_nd, check_profile: servicing_economics, rationale: "SEC contractual fees are combined with late/ancillary fees. Regulatory B492 is YTD net servicing fees across mortgages, credit cards, and other financial assets, so it is incompatible with the current grid definition."}
    ancillary_servicing_income: {periods: *all_nd, check_profile: servicing_economics, rationale: "Late charges and ancillary fees are not isolated from contractual servicing fees."}
    servicing_operating_expense: {periods: *all_nd, check_profile: servicing_economics, rationale: "Unreimbursed servicing costs is a partial component, not complete servicing operating expense."}
    servicing_pretax_income: {periods: *all_nd, check_profile: servicing_economics, rationale: "No servicing-only pretax result."}
    servicing_adjusted_pretax_income: {periods: *all_nd, check_profile: servicing_economics, rationale: "No issuer-reported adjusted servicing-only pretax result and reconciliation."}
    cost_to_service_per_loan: {periods: *all_nd, check_profile: servicing_economics, rationale: "No compatible serving expense and beginning/ending servicing loan counts; valuation cost-to-service assumptions are prohibited substitutes."}
    weighted_average_servicing_fee_bps: {periods: *all_nd, check_profile: servicing_economics, rationale: "Weighted average loan rate is borrower note rate, not contractual servicing fee rate."}
    msr_fair_value: {periods: *all_r, check_profile: msr, scope_id: wfc_owned_residential_msr, rationale: "Exact residential MSRs at fair value ending balance."}
    msr_beginning_balance: {periods: *all_nd, check_profile: msr, rationale: "Opening rows occur at the actual opening instant, not the selected quarter-end instant; no grid relabeling."}
    msr_additions: {periods: *all_nd, check_profile: msr, rationale: "Originations/purchases is combined and cannot isolate additions."}
    msr_purchases: {periods: *all_nd, check_profile: msr, rationale: "Originations/purchases is combined and cannot isolate purchases."}
    msr_sales: {periods: *all_nd, check_profile: msr, rationale: "Sales and other is combined; no exact sales-only row."}
    msr_realization_or_amortization: {periods: *except_q4_r, check_profile: msr, scope_id: wfc_owned_residential_msr, rationale: "Exact quarterly collection/realization row except Q4, where only annual is disclosed."}
    msr_fair_value_market_change: {periods: *except_q4_r, check_profile: msr, scope_id: wfc_owned_residential_msr, rationale: "Exact quarterly market-interest-rate change except Q4, where only annual is disclosed."}
    msr_fair_value_assumption_change: {periods: *except_q4_r, check_profile: msr, scope_id: wfc_owned_residential_msr, rationale: "Exact quarterly other valuation-input/assumption change except Q4, where only annual is disclosed."}
    msr_ending_balance: {periods: *all_r, check_profile: msr, scope_id: wfc_owned_residential_msr, rationale: "Exact residential MSR ending balance."}
    delinquency_30_plus_count_rate: &owned_loan_delinq_nd {periods: *all_nd, check_profile: delinquency, rationale: "The reported Home Lending 30+ rate is an owned-loan measure, excludes government-insured/guaranteed, HFS, and nonaccrual loans, and is not a servicing-population count rate."}
    delinquency_60_plus_count_rate: *owned_loan_delinq_nd
    delinquency_90_plus_count_rate: *owned_loan_delinq_nd
    government_servicing_upb: &mix_nd {periods: *all_nd, check_profile: composition, rationale: "No exact same-population servicing component under this canonical category."}
    conventional_servicing_upb: *mix_nd
    gnma_servicing_upb: *mix_nd
    fnma_servicing_upb: *mix_nd
    fhlmc_servicing_upb: *mix_nd
