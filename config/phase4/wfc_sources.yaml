coverage_gaps:
  - "No servicing-population loan count, count-based delinquency, or 60+/90+ servicing delinquency disclosure."
  - "The only Home Lending 30+ rate is an owned-loan measure with explicit government-insured/guaranteed, HFS, and nonaccrual exclusions."
  - "The 2026 Note 6 format drops the 2025 managed-servicing and owned-loans-serviced rows; loans serviced for others is preserved as a distinct scope."
  - "Q4 periodic MSR flows are annual. No annual-minus-YTD subtraction is authorized, so Q4 flow components remain ND unless the earnings supplement reports an exact current-quarter row."
  - "Contractually specified servicing fees are inseparable from late charges and ancillary fees."
  - "Originations/purchases and Sales and other are combined roll-forward rows; additions, purchases, and sales remain ND."
  - "FR Y-9C and Call Report bytes are not yet retained. B492, B804/B805, F699, 3164, and 6438/A590 remain separate regulatory research and reconciliation items, not authority to satisfy incompatible grid definitions."
