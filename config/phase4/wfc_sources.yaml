    population: residential mortgages serviced for others
    exclusions: [residential mortgage loans subserviced for others]
  - id: wfc_managed_residential_mortgage_servicing
    reporting_entity_id: wfc_sec_registrant
    category: TOTAL_SERVICING_PORTFOLIO
    source_label: Total managed servicing portfolio
    population: residential mortgages
    available_periods: ["2025-09-30", "2025-12-31"]
    boundary_note: "The 2026 Note 6 format no longer reports this managed total; loans-serviced-for-others is not substituted."
  - id: wfc_owned_residential_loans_serviced
    reporting_entity_id: wfc_sec_registrant
    category: BANK_OWNED_LOANS_SERVICED
    source_label: Owned loans serviced
    population: residential mortgages
    available_periods: ["2025-09-30", "2025-12-31"]
  - id: wfc_owned_residential_msr
    reporting_entity_id: wfc_sec_registrant
    category: OWNED_MSR_PORTFOLIO
    source_label: Residential MSRs at fair value
  - id: wfc_mortgage_banking_servicing_economics
    reporting_entity_id: wfc_sec_registrant
    category: COMBINED_MORTGAGE_BANKING_SEGMENT
    source_label: Note 6 Mortgage Banking Activities - total net servicing income
    inclusions: [servicing fees, late charges, ancillary fees, unreimbursed costs, MSR realization, valuation changes, economic hedges]
  - id: wfc_home_lending_owned_loan_metrics
    reporting_entity_id: wfc_home_lending_operating_unit
    category: CONSOLIDATED_COMPANY
    legal_consolidation_boundary: Wells Fargo & Company and Subsidiaries
    business_boundary: Home Lending disclosed operating unit
    portfolio_population: owned Home Lending loans
    source_label: Home lending loans 30+ days delinquency rate
    exclusions: [government-insured-or-guaranteed loans, loans held for sale, nonaccrual loans]
    canonical_servicing_scope: false
  - id: wfc_bhc_regulatory
