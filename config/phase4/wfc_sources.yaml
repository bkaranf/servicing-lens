    period_evidence:
      Q3_2025: {source_key: wfc_2025q3_10q, locator: "Note 6, Sep 30 2025 residential mortgages, Total serviced for others excluding subserviced for others"}
      Q4_2025: {source_key: wfc_2025q4_annual_report, locator: "Note 6, Dec 31 2025 residential mortgages, Total serviced for others excluding subserviced for others"}
      Q1_2026: {source_key: wfc_2026q1_10q, locator: "Note 6, Mar 31 2026 residential mortgages, Loans serviced for others"}
      Q2_2026: {source_key: wfc_2026q2_10q, locator: "Note 6, Jun 30 2026 residential mortgages, Loans serviced for others, unpaid principal balance"}
    reconciliation: "Earnings supplements report more precise preliminary third-party-serviced amounts; periodic filings report rounded final USD billions. Both exclude residential subservicing."
  total_servicing_upb:
    scope_id: wfc_managed_residential_mortgage_servicing
    period_evidence:
      Q3_2025: {source_key: wfc_2025q3_10q, locator: "Note 6, Sep 30 2025 residential mortgages, Total managed servicing portfolio"}
      Q4_2025: {source_key: wfc_2025q4_annual_report, locator: "Note 6, Dec 31 2025 residential mortgages, Total managed servicing portfolio"}
    missing_2026: "The 2026 Note 6 format reports loans serviced for others but no managed total or owned-loans-serviced component."
  bank_owned_loans_serviced_upb:
    scope_id: wfc_owned_residential_loans_serviced
    period_evidence:
      Q3_2025: {source_key: wfc_2025q3_10q, locator: "Note 6, Sep 30 2025 residential mortgages, Owned loans serviced"}
      Q4_2025: {source_key: wfc_2025q4_annual_report, locator: "Note 6, Dec 31 2025 residential mortgages, Owned loans serviced"}
    missing_2026: "The owned-loans-serviced row is absent from the changed 2026 Note 6 format."
  servicing_revenue:
    scope_id: wfc_mortgage_banking_servicing_economics
    source_methodology: WFC_TOTAL_NET_SERVICING_INCOME_INCLUDING_MSR_MARKS_AND_HEDGES
    period_evidence:
      Q3_2025: {source_key: wfc_2025q3_10q, state: REPORTED_ACTUAL, locator: "Note 6, quarter ended September 30 2025, Total net servicing income"}
      Q1_2026: {source_key: wfc_2026q1_10q, state: REPORTED_ACTUAL, locator: "Note 6, quarter ended March 31 2026, Total net servicing income"}
      Q2_2026: {source_key: wfc_2026q2_10q, state: REPORTED_ACTUAL, locator: "Note 6, quarter ended June 30 2026, Total net servicing income"}
    missing_q4: "The preliminary Home Lending Net servicing income row is not proven to share the Note 6 Total net servicing income boundary; Q3 values differ, so Q4 is not substituted into this metric."
    boundary_note: "The Note 6 issuer total includes valuation and hedge effects; it is not base servicing-fee income or operating-only revenue. Preliminary supplement facts remain separate source facts until an exact semantic bridge exists."
  msr_fair_value:
    scope_id: wfc_owned_residential_msr
    period_evidence: &msr_end_evidence
      Q3_2025: {source_key: wfc_2025q3_10q, locator: "Note 6, Residential MSRs at fair value, end of period, quarter ended September 30 2025"}
      Q4_2025: {source_key: wfc_2025q4_annual_report, locator: "Note 6, Residential MSRs at fair value, end of period, year ended December 31 2025"}
      Q1_2026: {source_key: wfc_2026q1_10q, locator: "Note 6, Residential MSRs at fair value, end of period, quarter ended March 31 2026"}
      Q2_2026: {source_key: wfc_2026q2_10q, locator: "Note 6, Residential MSRs at fair value, end of period, quarter ended June 30 2026"}
  msr_ending_balance:
    scope_id: wfc_owned_residential_msr
    period_evidence: *msr_end_evidence
  msr_realization_or_amortization:
    scope_id: wfc_owned_residential_msr
    period_evidence:
      Q3_2025: {source_key: wfc_2025q3_10q, locator: "Note 6, Changes due to collection/realization of expected cash flows, quarter ended September 30 2025"}
      Q1_2026: {source_key: wfc_2026q1_10q, locator: "Note 6, Changes due to collection/realization of expected cash flows, quarter ended March 31 2026"}
      Q2_2026: {source_key: wfc_2026q2_10q, locator: "Note 6, Changes due to collection/realization of expected cash flows, quarter ended June 30 2026"}
    missing_q4: "The 10-K row is annual; no exact standalone Q4 realization row is disclosed and no subtraction is authorized."
  msr_fair_value_market_change:
    scope_id: wfc_owned_residential_msr
    period_evidence:
      Q3_2025: {source_key: wfc_2025q3_10q, locator: "Note 6, Changes in fair value of MSRs due to market interest rates, quarter ended September 30 2025"}
      Q1_2026: {source_key: wfc_2026q1_10q, locator: "Note 6, Changes in fair value of MSRs due to market interest rates, quarter ended March 31 2026"}
      Q2_2026: {source_key: wfc_2026q2_10q, locator: "Note 6, Changes in fair value of MSRs due to market interest rates, quarter ended June 30 2026"}
    missing_q4: "The 10-K row is annual; no exact standalone Q4 market-change row is disclosed."
  msr_fair_value_assumption_change:
    scope_id: wfc_owned_residential_msr
    period_evidence:
      Q3_2025: {source_key: wfc_2025q3_10q, locator: "Note 6, Changes in fair value of MSRs due to other valuation inputs or assumptions, quarter ended September 30 2025"}
      Q1_2026: {source_key: wfc_2026q1_10q, locator: "Note 6, Changes in fair value of MSRs due to other valuation inputs or assumptions, quarter ended March 31 2026"}
      Q2_2026: {source_key: wfc_2026q2_10q, locator: "Note 6, Changes in fair value of MSRs due to other valuation inputs or assumptions, quarter ended June 30 2026"}
    missing_q4: "The 10-K row is annual; no exact standalone Q4 other-input/assumption change is disclosed."
  msr_hedging_result:
    scope_id: wfc_owned_residential_msr
    period_evidence:
      Q3_2025: {source_key: wfc_2025q3_10q, locator: "Note 6, Net derivative gain (losses) from economic hedges, quarter ended September 30 2025"}
      Q1_2026: {source_key: wfc_2026q1_10q, locator: "Note 6, Net derivative gains (losses) from economic hedges, quarter ended March 31 2026"}
      Q2_2026: {source_key: wfc_2026q2_10q, locator: "Note 6, Net derivative gains (losses) from economic hedges, quarter ended June 30 2026"}
    missing_q4: "The 10-K row is annual; no exact standalone Q4 hedge result is disclosed."
  msr_fair_value_inputs_or_assumptions_change:
    scope_id: wfc_owned_residential_msr
    assessment: NOT_DISCLOSED_INCOMPATIBLE_METHODOLOGY
    rule: "WFC separately discloses market-interest-rate and other-input/assumption changes; those components are not relabeled as the catalog's combined-only metric."
  msr_fair_value_multiple_of_related_upb:
    assessment: DERIVABLE_RESEARCH_ONLY
    formula: msr_fair_value / servicing_for_others_upb
    periods: [Q3_2025, Q4_2025, Q1_2026, Q2_2026]
    rule: "Requires future governed WFC scope-bridge and publication implementation; no derived value is configured here."
  msr_fair_value_bps_of_related_upb:
    assessment: DERIVABLE_RESEARCH_ONLY
    formula: (msr_fair_value / servicing_for_others_upb) * 10000
    periods: [Q3_2025, Q4_2025, Q1_2026, Q2_2026]
    rule: "Requires future governed WFC scope-bridge and publication implementation; no derived value is configured here."

