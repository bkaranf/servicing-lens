regulatory_research_expectations:
  status: REGULATORY_RESEARCH_NOT_ACQUIRED
  rule: >-
    SEC evidence does not establish regulatory-source completeness. Native BHC
    and depository reports remain separate research and reconciliation sources;
    none of the configured items is eligible to populate an incompatible current
    WFC grid cell merely because it describes related servicing economics.
  report_dates: ["2025-09-30", "2025-12-31", "2026-03-31", "2026-06-30"]
  sources:
    - family: FR_Y9C
      reporter_rssd: "1120754"
      reporting_scope_id: wfc_bhc_regulatory
      official_url: "https://www.ffiec.gov/npw/FinancialReport/FinancialDataDownload"
      expected_items:
        - {series: BHCKB804, schedule: HC-S, item: M2.a, semantic: residential_servicing_for_others_with_recourse}
        - {series: BHCKB805, schedule: HC-S, item: M2.b, semantic: residential_servicing_for_others_without_recourse}
        - {series: BHCKF699, schedule: HC-S, item: M2.c, semantic: residential_servicing_for_others_in_foreclosure}
        - {series: BHCKB492, schedule: HI, item: 5.f, semantic: net_servicing_fees_all_financial_assets}
        - {series: BHCK3164, schedule: HC-M, item: 12.a, semantic: mortgage_servicing_assets_carrying_amount}
        - {series: BHCK6438, schedule: HC-M, item: 12.a.1, semantic: mortgage_servicing_assets_fair_value}
    - family: FFIEC_CDR_CALL
      reporter_rssd: "451965"
      reporting_scope_id: wells_fargo_bank_na_regulatory
      official_url: "https://cdr.ffiec.gov/public/PWS/DownloadBulkData.aspx"
      expected_items:
        - {series: RCFDB804, alternate_series: RCONB804, schedule: RC-S, item: M2.a, semantic: residential_servicing_for_others_with_recourse}
        - {series: RCFDB805, alternate_series: RCONB805, schedule: RC-S, item: M2.b, semantic: residential_servicing_for_others_without_recourse}
        - {series: RCFDF699, alternate_series: RCONF699, schedule: RC-S, item: M2.c, semantic: residential_servicing_for_others_in_foreclosure}
        - {series: RIADB492, schedule: RI, item: 5.f, semantic: net_servicing_fees_all_financial_assets}
        - {series: RCFD3164, alternate_series: RCON3164, schedule: RC-M, item: 2.a, semantic: mortgage_servicing_assets_carrying_amount}
        - {series: RCFDA590, alternate_series: RCONA590, schedule: RC-M, item: 2.a.1, semantic: mortgage_servicing_assets_estimated_fair_value}
  research_only_not_grid_eligible:
    - source_items: [BHCKB492, RIADB492]
      reason: >-
        B492 is YTD net servicing fees across mortgages, credit cards, and other
        financial assets. It is not the current contractual
        servicing/subservicing fee-income metric and cannot satisfy the grid.
    - source_items: [BHCKF699, RCFDF699, RCONF699]
      related_denominator_items: [BHCKB804, BHCKB805, RCFDB804, RCONB804, RCFDB805, RCONB805]
      reason: >-
        These native regulatory facts measure 1-4 family residential assets
        serviced for others. The current foreclosure_upb and
        foreclosure_upb_rate definitions require PFSI's owned_msr_and_msl
        population, so regulatory research cannot satisfy either grid metric.
  reconciliation_metric_ids:
    - servicing_for_others_upb
    - msr_fair_value
    - msr_ending_balance

