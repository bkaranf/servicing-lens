schema_version: "1"
mapping_version: "financial-fields-phase5-v1"

# This is a deliberately small Phase 2 selection, not a financial ontology.
# The file is directly loadable by XbrlMappingRegistry; the additional keys are
# discovery and review metadata. A mapping identifies eligible source facts but
# never approves a value. Every selected mapping remains CANDIDATE and every
# proposed golden expectation remains REVIEW_REQUIRED until an independent exact
# representation or attributable reviewer approval is recorded.
metric_definitions:
  - metric_id: total_assets
    semantic_version: "1.0.0"
    display_name: Total Assets
    category: core_financial
    business_meaning: Consolidated period-end total assets reported by the SEC registrant.
    grain: reporting entity, reporting scope, fiscal period
    unit: USD
  - metric_id: servicing_for_others_upb
    semantic_version: "1.0.0"
    display_name: Servicing For Others UPB
    category: portfolio
    business_meaning: Period-end UPB serviced for third-party owners in the disclosed population.
    grain: reporting entity, reporting scope, fiscal period
    unit: USD
  - metric_id: total_servicing_upb
    semantic_version: "1.0.0"
    display_name: Total Servicing UPB
    category: portfolio
    business_meaning: Issuer-defined period-end total servicing portfolio UPB.
    grain: reporting entity, reporting scope, fiscal period
    unit: USD
  - metric_id: owned_msr_upb
    semantic_version: "1.0.0"
    display_name: Owned MSR UPB
    category: portfolio
    business_meaning: UPB underlying servicing rights owned by the reporting entity.
    grain: reporting entity, reporting scope, fiscal period
    unit: USD

