catalog_version: "1.0.0"
effective_period: "2025-07-01/open"
# Sole runtime entry point. All supported current and historical semantic
# definitions, taxonomies, and reconciliation rules live in this declarative
# catalog; the newest semantic version is current and prior versions are
# historical lineage.
catalog_role: canonical_runtime
definition_lifecycle_policy: newest_semantic_version_current_prior_historical
defaults: &defaults
  semantic_version: "1.0.0"
  grain: "reporting entity, reporting scope, fiscal period"
  numerator: null
  denominator: null
  permitted_reporting_scopes: ["explicit issuer-disclosed scope"]
  currency: USD
  methodology_variants: ["reported", "deterministically derived"]
  source_labels_and_aliases: []
  inclusion_rules: ["include only the population named by the source"]
  exclusion_rules: ["exclude silently substituted populations"]
  derivation_formula: null
  required_evidence: ["authoritative source", "bounded locator", "reported label"]
  reconciliation_rules: ["reconcile totals and roll-forwards when components exist"]
  comparability_rules: ["assess pairwise using entity, scope, period, unit, methodology, and population"]
  prohibited_interpretations: ["missing is not zero", "a similarly named metric is not a substitute"]
metrics:
  - {id: servicing_for_others_upb, category: portfolio, business_meaning: "Period-end UPB serviced for third-party owners in the disclosed population.", unit: USD, scale: millions, period_semantics: instant, <<: *defaults}
  - {id: total_servicing_upb, category: portfolio, business_meaning: "Issuer-defined period-end total servicing portfolio UPB.", unit: USD, scale: millions, period_semantics: instant, <<: *defaults}
  - {id: owned_msr_upb, category: portfolio, business_meaning: "UPB underlying servicing rights owned by the reporting entity.", unit: USD, scale: millions, period_semantics: instant, <<: *defaults}
  - {id: servicing_loan_count, category: portfolio, business_meaning: "Count of loans in the explicitly disclosed servicing population.", unit: count, scale: ones, period_semantics: instant, <<: *defaults}
  - {id: subservicing_upb, category: portfolio, business_meaning: "UPB serviced without ownership of the associated servicing right.", unit: USD, scale: millions, period_semantics: instant, <<: *defaults}
  - {id: bank_owned_loans_serviced_upb, category: portfolio, business_meaning: "UPB of loans owned by a bank and serviced by it.", unit: USD, scale: millions, period_semantics: instant, <<: *defaults}
  - {id: interim_servicing_upb, category: portfolio, business_meaning: "UPB temporarily serviced before sale or transfer.", unit: USD, scale: millions, period_semantics: instant, <<: *defaults}
  - {id: servicing_revenue, category: servicing_economics, business_meaning: "Revenue from the issuer-defined servicing activity and scope.", unit: USD, scale: millions, period_semantics: duration, <<: *defaults}
  - {id: servicing_fee_income, category: servicing_economics, business_meaning: "Contractual servicing and subservicing fee income.", unit: USD, scale: millions, period_semantics: duration, <<: *defaults}
  - {id: ancillary_servicing_income, category: servicing_economics, business_meaning: "Disclosed ancillary income attributable to servicing.", unit: USD, scale: millions, period_semantics: duration, <<: *defaults}
  - {id: servicing_operating_expense, category: servicing_economics, business_meaning: "Operating expense attributable to the disclosed servicing scope.", unit: USD, scale: millions, period_semantics: duration, <<: *defaults}
  - {id: servicing_pretax_income, category: servicing_economics, business_meaning: "GAAP pretax income of an explicit servicing segment.", unit: USD, scale: millions, period_semantics: duration, <<: *defaults}
  - {id: servicing_adjusted_pretax_income, category: servicing_economics, business_meaning: "Issuer-defined non-GAAP servicing pretax result with reconciliation.", unit: USD, scale: millions, period_semantics: duration, <<: *defaults}
  - {id: cost_to_service_per_loan, category: servicing_economics, business_meaning: "Issuer-disclosed cost to service per loan for a named population.", unit: USD_per_loan, scale: ones, period_semantics: duration, <<: *defaults}
  - {id: weighted_average_servicing_fee_bps, category: servicing_economics, business_meaning: "Weighted-average contractual servicing fee in basis points.", unit: basis_points, scale: basis_points, period_semantics: instant, <<: *defaults}
  - {id: msr_fair_value, category: msr, business_meaning: "Carrying fair value of mortgage servicing rights.", unit: USD, scale: millions, period_semantics: instant, <<: *defaults}
  - {id: msr_beginning_balance, category: msr, business_meaning: "Beginning balance in an MSR roll-forward.", unit: USD, scale: millions, period_semantics: instant, <<: *defaults}
  - {id: msr_additions, category: msr, business_meaning: "MSRs added through retained production or other disclosed creation.", unit: USD, scale: millions, period_semantics: duration, <<: *defaults}
  - {id: msr_purchases, category: msr, business_meaning: "MSRs acquired through purchases.", unit: USD, scale: millions, period_semantics: duration, <<: *defaults}
  - {id: msr_sales, category: msr, business_meaning: "MSR carrying value removed through sales.", unit: USD, scale: millions, period_semantics: duration, <<: *defaults}
  - {id: msr_realization_or_amortization, category: msr, business_meaning: "MSR reduction from realized cash flows or amortization.", unit: USD, scale: millions, period_semantics: duration, <<: *defaults}
  - {id: msr_fair_value_market_change, category: msr, business_meaning: "MSR fair-value change attributed to market movement.", unit: USD, scale: millions, period_semantics: duration, <<: *defaults}
  - {id: msr_fair_value_assumption_change, category: msr, business_meaning: "MSR fair-value change attributed to model inputs or assumptions.", unit: USD, scale: millions, period_semantics: duration, <<: *defaults}
  - {id: msr_ending_balance, category: msr, business_meaning: "Ending balance in an MSR roll-forward.", unit: USD, scale: millions, period_semantics: instant, <<: *defaults}
  - {id: delinquency_30_plus_count_rate, category: portfolio_quality, business_meaning: "Share of disclosed loan count at least 30 days delinquent.", unit: percent, scale: percent, period_semantics: instant, <<: *defaults}
  - {id: delinquency_60_plus_count_rate, category: portfolio_quality, business_meaning: "Share of disclosed loan count at least 60 days delinquent.", unit: percent, scale: percent, period_semantics: instant, <<: *defaults}
  - {id: delinquency_90_plus_count_rate, category: portfolio_quality, business_meaning: "Share of disclosed loan count at least 90 days delinquent.", unit: percent, scale: percent, period_semantics: instant, <<: *defaults}
  - {id: government_servicing_upb, category: portfolio_quality, business_meaning: "Servicing UPB in government-insured or guaranteed programs.", unit: USD, scale: millions, period_semantics: instant, <<: *defaults}
  - {id: conventional_servicing_upb, category: portfolio_quality, business_meaning: "Servicing UPB in the issuer-defined conventional population.", unit: USD, scale: millions, period_semantics: instant, <<: *defaults}
  - {id: gnma_servicing_upb, category: portfolio_quality, business_meaning: "UPB of Ginnie Mae servicing in the disclosed scope.", unit: USD, scale: millions, period_semantics: instant, <<: *defaults}
  - {id: fnma_servicing_upb, category: portfolio_quality, business_meaning: "UPB of Fannie Mae servicing in the disclosed scope.", unit: USD, scale: millions, period_semantics: instant, <<: *defaults}
  - {id: fhlmc_servicing_upb, category: portfolio_quality, business_meaning: "UPB of Freddie Mac servicing in the disclosed scope.", unit: USD, scale: millions, period_semantics: instant, <<: *defaults}
dimension_taxonomies:
  - id: portfolio_population
    values: [servicing_for_others, owned_msr, owned_msr_and_msl, total_servicing, subservicing, interim_servicing, issuer_disclosed]
  - id: delinquency_measure_basis
    values: [count, upb]
  - id: delinquency_threshold
    values: [30_to_89, 30_plus, 60_plus, 90_plus, foreclosure]
  - id: delinquency_denominator
    values: [loan_count, unpaid_principal_balance]
  - id: delinquency_foreclosure_treatment
    values: [included, excluded, separately_reported]
  - id: delinquency_bankruptcy_treatment
    values: [included, excluded, source_defined]
  - id: delinquency_forbearance_treatment
    values: [included, excluded, source_defined]
  - id: portfolio_mix_category
    values: [government, conventional, gnma, fnma, fhlmc, other]
  - id: portfolio_mix_basis
    values: [upb, count]
  - id: portfolio_mix_overlap
    values: [mutually_exclusive, overlapping, source_defined]
  - id: msr_population
    values: [owned_msr, fair_value_class, issuer_disclosed]
  - id: servicing_component
    values: [fha, va, usda, closed_end_second_lien, other]

metric_versions:
  - metric_id: cost_to_service_per_loan
    semantic_version: "2.0.0"
    category: servicing_economics
    definition: "Servicing operating expense annualized on an explicit actual-day basis and divided by the arithmetic average of compatible beginning and ending serviced-loan counts for the same duration."
    unit: USD_per_loan
    scale: "1"
    period_types: [duration]
    methodologies: [DETERMINISTIC_DERIVED, ISSUER_REPORTED]
    dimensions:
      - {taxonomy: portfolio_population, fixed_value: null}
    validation_rules: [FINITE, NONNEGATIVE]
    comparability:
      methodology_policy: EXACT
      dimensions: [portfolio_population]
    reconciliation_rules: [FORMULA_REPRODUCES_INPUTS, NO_ENDING_BALANCE_SHORTCUT, ANNUALIZATION_TRACE_REQUIRED]
    quantization: {quantum: "0.01", rounding: ROUND_HALF_EVEN}
    derivation:
      formula: ANNUALIZED_EXPENSE_PER_AVERAGE_LOAN
      formula_version: "1.0.0"
      averaging: ARITHMETIC_BEGIN_END
      annualization: ACTUAL_DAYS
      inputs:
        - {role: expense, metric_ids: [servicing_operating_expense], unit: USD, period_relation: SAME_DURATION}
        - {role: beginning_loan_count, metric_ids: [servicing_loan_count], unit: count, period_relation: BEGINNING_INSTANT, allowed_scope_pairs: [[pfsi_total_servicing_portfolio, pfsi_servicing_segment]]}
        - {role: ending_loan_count, metric_ids: [servicing_loan_count], unit: count, period_relation: ENDING_INSTANT, allowed_scope_pairs: [[pfsi_total_servicing_portfolio, pfsi_servicing_segment]]}

  - metric_id: weighted_average_servicing_fee_bps
    semantic_version: "2.0.0"
    category: servicing_economics
    definition: "Eligible servicing fee income annualized on an explicit actual-day basis and divided by the arithmetic average of compatible beginning and ending UPB."
    unit: basis_points
    scale: "1"
    period_types: [instant, duration]
    methodologies: [DETERMINISTIC_DERIVED, ISSUER_REPORTED]
    dimensions:
      - {taxonomy: portfolio_population, fixed_value: null}
    validation_rules: [FINITE, NONNEGATIVE, BPS_0_10000]
    comparability:
      methodology_policy: EXACT
      dimensions: [portfolio_population]
    reconciliation_rules: [FORMULA_REPRODUCES_INPUTS, ANNUALIZATION_TRACE_REQUIRED]
    quantization: {quantum: "0.000001", rounding: ROUND_HALF_EVEN}
    derivation:
      formula: ANNUALIZED_RATE_BPS
      formula_version: "1.0.0"
      averaging: ARITHMETIC_BEGIN_END
      annualization: ACTUAL_OVER_BASIS
      inputs:
        - {role: fee_income, metric_ids: [servicing_fee_income], unit: USD, period_relation: SAME_DURATION}
        - {role: beginning_upb, metric_ids: [owned_msr_upb, servicing_for_others_upb], unit: USD, period_relation: BEGINNING_INSTANT}
        - {role: ending_upb, metric_ids: [owned_msr_upb, servicing_for_others_upb], unit: USD, period_relation: ENDING_INSTANT}

  - &delinquency_count_30
    metric_id: delinquency_30_plus_count_rate
    semantic_version: "2.0.0"
    category: portfolio_quality
    definition: "Share of loans at least 30 days delinquent by count in the explicitly disclosed servicing population."
    unit: ratio
    scale: "1"
    period_types: [instant]
    methodologies: [DELINQUENCY_COUNT_REPORTED, SEC_FILING_EXHIBIT, SEC_FILING_XBRL]
    dimensions:
      - {taxonomy: portfolio_population, fixed_value: null}
      - {taxonomy: delinquency_measure_basis, fixed_value: count}
      - {taxonomy: delinquency_threshold, fixed_value: 30_plus}
      - {taxonomy: delinquency_denominator, fixed_value: loan_count}
      - {taxonomy: delinquency_foreclosure_treatment, fixed_value: null}
      - {taxonomy: delinquency_bankruptcy_treatment, fixed_value: null}
      - {taxonomy: delinquency_forbearance_treatment, fixed_value: null}
    validation_rules: [FINITE, RATIO_0_1]
    comparability:
      methodology_policy: EXACT
      dimensions: [portfolio_population, delinquency_measure_basis, delinquency_threshold, delinquency_denominator, delinquency_foreclosure_treatment, delinquency_bankruptcy_treatment, delinquency_forbearance_treatment]
    reconciliation_rules: [DELINQUENCY_BUCKETS_TO_DISCLOSED_TOTAL]
    quantization: {quantum: "0.0000000001", rounding: ROUND_HALF_EVEN}
    derivation: null

  - <<: *delinquency_count_30
    metric_id: delinquency_60_plus_count_rate
    definition: "Share of loans at least 60 days delinquent by count in the explicitly disclosed servicing population."
    dimensions:
      - {taxonomy: portfolio_population, fixed_value: null}
      - {taxonomy: delinquency_measure_basis, fixed_value: count}
      - {taxonomy: delinquency_threshold, fixed_value: 60_plus}
      - {taxonomy: delinquency_denominator, fixed_value: loan_count}
      - {taxonomy: delinquency_foreclosure_treatment, fixed_value: null}
      - {taxonomy: delinquency_bankruptcy_treatment, fixed_value: null}
      - {taxonomy: delinquency_forbearance_treatment, fixed_value: null}

  - <<: *delinquency_count_30
    metric_id: delinquency_90_plus_count_rate
    definition: "Share of loans at least 90 days delinquent by count in the explicitly disclosed servicing population."
    dimensions:
      - {taxonomy: portfolio_population, fixed_value: null}
      - {taxonomy: delinquency_measure_basis, fixed_value: count}
      - {taxonomy: delinquency_threshold, fixed_value: 90_plus}
      - {taxonomy: delinquency_denominator, fixed_value: loan_count}
      - {taxonomy: delinquency_foreclosure_treatment, fixed_value: null}
      - {taxonomy: delinquency_bankruptcy_treatment, fixed_value: null}
      - {taxonomy: delinquency_forbearance_treatment, fixed_value: null}

  - &delinquency_upb_30
    metric_id: delinquency_30_plus_upb_rate
    semantic_version: "1.0.0"
    category: portfolio_quality
    definition: "Share of unpaid principal balance at least 30 days delinquent in the explicitly disclosed servicing population."
    unit: ratio
    scale: "1"
    period_types: [instant]
    methodologies: [DETERMINISTIC_DERIVED, DELINQUENCY_UPB_REPORTED, SEC_FILING_EXHIBIT, SEC_FILING_XBRL, REGULATORY_REPORTED]
    dimensions:
      - {taxonomy: portfolio_population, fixed_value: null}
      - {taxonomy: delinquency_measure_basis, fixed_value: upb}
      - {taxonomy: delinquency_threshold, fixed_value: 30_plus}
      - {taxonomy: delinquency_denominator, fixed_value: unpaid_principal_balance}
      - {taxonomy: delinquency_foreclosure_treatment, fixed_value: null}
      - {taxonomy: delinquency_bankruptcy_treatment, fixed_value: null}
      - {taxonomy: delinquency_forbearance_treatment, fixed_value: null}
    validation_rules: [FINITE, RATIO_0_1]
    comparability:
      methodology_policy: EXACT
      dimensions: [portfolio_population, delinquency_measure_basis, delinquency_threshold, delinquency_denominator, delinquency_foreclosure_treatment, delinquency_bankruptcy_treatment, delinquency_forbearance_treatment]
    reconciliation_rules: [DELINQUENCY_BUCKETS_TO_DISCLOSED_TOTAL]
    quantization: {quantum: "0.0000000001", rounding: ROUND_HALF_EVEN}
    derivation:
      formula: SUM_INPUTS_OVER_DENOMINATOR
      formula_version: "1.0.0"
      averaging: NONE
      annualization: NONE
      inputs:
        - {role: days_30_to_89, metric_ids: [delinquency_30_to_89_upb], unit: USD, period_relation: SAME_INSTANT}
        - {role: days_90_plus, metric_ids: [delinquency_90_plus_upb], unit: USD, period_relation: SAME_INSTANT}
        - {role: denominator, metric_ids: [owned_msr_msl_upb], unit: USD, period_relation: SAME_INSTANT}

  - <<: *delinquency_upb_30
    metric_id: delinquency_60_plus_upb_rate
    definition: "Share of unpaid principal balance at least 60 days delinquent in the explicitly disclosed servicing population."
    dimensions:
      - {taxonomy: portfolio_population, fixed_value: null}
      - {taxonomy: delinquency_measure_basis, fixed_value: upb}
      - {taxonomy: delinquency_threshold, fixed_value: 60_plus}
      - {taxonomy: delinquency_denominator, fixed_value: unpaid_principal_balance}
      - {taxonomy: delinquency_foreclosure_treatment, fixed_value: null}
      - {taxonomy: delinquency_bankruptcy_treatment, fixed_value: null}
      - {taxonomy: delinquency_forbearance_treatment, fixed_value: null}
    derivation: null

  - <<: *delinquency_upb_30
    metric_id: delinquency_90_plus_upb_rate
    definition: "Share of unpaid principal balance at least 90 days delinquent in the explicitly disclosed servicing population."
    dimensions:
      - {taxonomy: portfolio_population, fixed_value: null}
      - {taxonomy: delinquency_measure_basis, fixed_value: upb}
      - {taxonomy: delinquency_threshold, fixed_value: 90_plus}
      - {taxonomy: delinquency_denominator, fixed_value: unpaid_principal_balance}
      - {taxonomy: delinquency_foreclosure_treatment, fixed_value: null}
      - {taxonomy: delinquency_bankruptcy_treatment, fixed_value: null}
      - {taxonomy: delinquency_forbearance_treatment, fixed_value: null}
    derivation:
      formula: RATIO
      formula_version: "1.0.0"
      averaging: NONE
      annualization: NONE
      inputs:
        - {role: numerator, metric_ids: [delinquency_90_plus_upb], unit: USD, period_relation: SAME_INSTANT}
        - {role: denominator, metric_ids: [owned_msr_msl_upb], unit: USD, period_relation: SAME_INSTANT}

  - <<: *delinquency_upb_30
    metric_id: foreclosure_upb_rate
    definition: "Share of unpaid principal balance in foreclosure in the explicitly disclosed servicing population."
    dimensions:
      - {taxonomy: portfolio_population, fixed_value: null}
      - {taxonomy: delinquency_measure_basis, fixed_value: upb}
      - {taxonomy: delinquency_threshold, fixed_value: foreclosure}
      - {taxonomy: delinquency_denominator, fixed_value: unpaid_principal_balance}
      - {taxonomy: delinquency_foreclosure_treatment, fixed_value: separately_reported}
      - {taxonomy: delinquency_bankruptcy_treatment, fixed_value: null}
      - {taxonomy: delinquency_forbearance_treatment, fixed_value: null}
    derivation:
      formula: RATIO
      formula_version: "1.0.0"
      averaging: NONE
      annualization: NONE
      inputs:
        - {role: numerator, metric_ids: [foreclosure_upb], unit: USD, period_relation: SAME_INSTANT}
        - {role: denominator, metric_ids: [owned_msr_msl_upb], unit: USD, period_relation: SAME_INSTANT}

  - metric_id: reo_upb
    semantic_version: "1.0.0"
    category: portfolio_quality
    definition: "Unpaid principal balance or carrying amount explicitly identified as real-estate-owned exposure for the disclosed servicing population."
    unit: USD
    scale: "1"
    period_types: [instant]
    methodologies: [ISSUER_REPORTED, SEC_FILING_EXHIBIT, SEC_FILING_XBRL, REGULATORY_REPORTED]
    dimensions:
      - {taxonomy: portfolio_population, fixed_value: null}
    validation_rules: [FINITE, NONNEGATIVE]
    comparability: {methodology_policy: EXACT, dimensions: [portfolio_population]}
    reconciliation_rules: [RECONCILE_TO_DISCLOSED_PORTFOLIO_ONLY]
    quantization: {quantum: "0.01", rounding: ROUND_HALF_EVEN}
    derivation: null

  - metric_id: msr_hedging_result
    semantic_version: "1.0.0"
    category: msr_economics
    definition: "Signed issuer-reported result of instruments explicitly designated or presented as hedging the MSR fair-value exposure."
    unit: USD
    scale: "1"
    period_types: [duration]
    methodologies: [MSR_HEDGE_RESULT_REPORTED, SEC_FILING_EXHIBIT, SEC_FILING_XBRL]
    dimensions:
      - {taxonomy: msr_population, fixed_value: null}
    validation_rules: [FINITE, SIGNED]
    comparability: {methodology_policy: EXACT, dimensions: [msr_population]}
    reconciliation_rules: [MSR_HEDGE_SEPARATE_FROM_OPERATIONS, MSR_SPLIT_TO_DISCLOSED_TOTAL]
    quantization: {quantum: "0.01", rounding: ROUND_HALF_EVEN}
    derivation: null

  - &msr_flow_exact_periods
    metric_id: msr_additions
    semantic_version: "2.0.0"
    category: msr_economics
    definition: "MSRs added through retained production or other explicitly disclosed creation during the exact source period."
    unit: USD
    scale: "1"
    period_types: [duration, duration_ytd, annual]
    methodologies: [MSR_FAIR_VALUE_ROLLFORWARD_REPORTED, SEC_FILING_EXHIBIT, SEC_FILING_XBRL]
    dimensions:
      - {taxonomy: msr_population, fixed_value: null}
    validation_rules: [FINITE, NONNEGATIVE]
    comparability: {methodology_policy: EXACT, dimensions: [msr_population]}
    reconciliation_rules: [MSR_ROLLFORWARD_COMPLETE]
    quantization: {quantum: "0.01", rounding: ROUND_HALF_EVEN}
    derivation: null

  - <<: *msr_flow_exact_periods
    metric_id: msr_purchases
    definition: "MSRs acquired through purchases during the exact source period."

  - <<: *msr_flow_exact_periods
    metric_id: msr_sales
    definition: "Positive MSR carrying-value reduction from sales during the exact source period."

  - metric_id: msr_fair_value_inputs_or_assumptions_change
    semantic_version: "1.0.0"
    category: msr_economics
    definition: "Signed fair-value change reported as one combined inputs-or-assumptions row when the issuer does not disclose separable market and assumption components."
    unit: USD
    scale: "1"
    period_types: [duration, duration_ytd, annual]
    methodologies: [MSR_FAIR_VALUE_ROLLFORWARD_REPORTED, SEC_FILING_EXHIBIT, SEC_FILING_XBRL]
    dimensions:
      - {taxonomy: msr_population, fixed_value: null}
    validation_rules: [FINITE, SIGNED]
    comparability: {methodology_policy: EXACT, dimensions: [msr_population]}
    reconciliation_rules: [MSR_ROLLFORWARD_COMPLETE, DO_NOT_SPLIT_COMBINED_ISSUER_ROW]
    quantization: {quantum: "0.01", rounding: ROUND_HALF_EVEN}
    derivation: null

  - metric_id: msr_realization_passage_time_and_other
    semantic_version: "1.0.0"
    category: msr_economics
    definition: "Positive reduction magnitude for one issuer-reported combined realization, passage-of-time, and other row that cannot be resolved into narrower components."
    unit: USD
    scale: "1"
    period_types: [duration, duration_ytd, annual]
    methodologies: [MSR_FAIR_VALUE_ROLLFORWARD_REPORTED, SEC_FILING_EXHIBIT, SEC_FILING_XBRL]
    dimensions:
      - {taxonomy: msr_population, fixed_value: null}
    validation_rules: [FINITE, NONNEGATIVE]
    comparability: {methodology_policy: EXACT, dimensions: [msr_population]}
    reconciliation_rules: [MSR_ROLLFORWARD_COMPLETE, DO_NOT_SPLIT_COMBINED_ISSUER_ROW]
    quantization: {quantum: "0.01", rounding: ROUND_HALF_EVEN}
    derivation: null

  - &msr_split_market
    metric_id: msr_fair_value_market_change
    semantic_version: "2.0.0"
    category: msr_economics
    definition: "Signed MSR fair-value change explicitly attributed to market inputs and separately disclosed from assumption changes."
    unit: USD
    scale: "1"
    period_types: [duration]
    methodologies: [MSR_FAIR_VALUE_ROLLFORWARD_REPORTED, SEC_FILING_EXHIBIT, SEC_FILING_XBRL]
    dimensions:
      - {taxonomy: msr_population, fixed_value: null}
    validation_rules: [FINITE, SIGNED]
    comparability: {methodology_policy: EXACT, dimensions: [msr_population]}
    reconciliation_rules: [MSR_SPLIT_TO_DISCLOSED_TOTAL, NARROW_COMPONENT_REQUIRES_EXPLICIT_SOURCE_ROW]
    quantization: {quantum: "0.01", rounding: ROUND_HALF_EVEN}
    derivation: null

  - <<: *msr_split_market
    metric_id: msr_fair_value_assumption_change
    definition: "Signed MSR fair-value change explicitly attributed to model assumptions and separately disclosed from market-input changes."

  - metric_id: msr_fair_value_multiple_of_related_upb
    semantic_version: "1.0.0"
    category: msr_economics
    definition: "MSR fair value divided by the exact related owned-MSR UPB at the same instant and for the same population."
    unit: multiple
    scale: "1"
    period_types: [instant]
    methodologies: [DETERMINISTIC_DERIVED]
    dimensions:
      - {taxonomy: msr_population, fixed_value: owned_msr}
    validation_rules: [FINITE, NONNEGATIVE]
    comparability: {methodology_policy: EXACT, dimensions: [msr_population]}
    reconciliation_rules: [FORMULA_REPRODUCES_INPUTS, RELATED_UPB_REQUIRED]
    quantization: {quantum: "0.0000000001", rounding: ROUND_HALF_EVEN}
    derivation:
      formula: FAIR_VALUE_TO_UPB_MULTIPLE
      formula_version: "1.0.0"
