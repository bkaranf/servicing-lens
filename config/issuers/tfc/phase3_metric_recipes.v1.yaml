recipe_version: "1.0.0"
issuer_id: tfc
cik: "0000092230"
reporting_entity_id: tfc_registrant
manifest: ../../recorded_evidence/phase3/tfc/manifest.v1.yaml

checked_source_sets:
  "2025Q3": [phase3-tfc-2025q3-qps, phase3-tfc-2025q3-10q]
  "2025Q4": [phase3-tfc-2025q4-qps, phase3-tfc-2025q4-10k]
  "2026Q1": [phase3-tfc-2026q1-qps, phase3-tfc-2026q1-10q]
  "2026Q2": [phase3-tfc-2026q2-qps, phase3-tfc-2026q2-10q]

source_set_policy:
  issuer_ir_status: NOT_REQUIRED_FILED_EQUIVALENTS_RETAINED
  xbrl_status: CHECKED_WITHIN_RETAINED_INLINE_XBRL_PERIODIC_FILINGS
  regulatory_scope_status: EXCLUDED_FROM_SEC_SCOPE_MISSINGNESS
  regulatory_scope_reason: >-
    FR Y-9C and Call Report facts belong to the BHC or depository regulatory
    reporter and cannot establish disclosure or missingness for the SEC
    registrant's residential servicing scope.

periods:
  "2025Q3":
    period_end: "2025-09-30"
    qps_evidence_id: phase3-tfc-2025q3-qps
    periodic_evidence_id: phase3-tfc-2025q3-10q
    rollforward_period_start: "2025-01-01"
    rollforward_period_type: duration_ytd
    rollforward_header: "2025"
    msr_ending_label: "Residential MSRs, carrying value, September 30"
  "2025Q4":
    period_end: "2025-12-31"
    qps_evidence_id: phase3-tfc-2025q4-qps
    periodic_evidence_id: phase3-tfc-2025q4-10k
    rollforward_period_start: "2025-01-01"
    rollforward_period_type: duration_annual
    rollforward_header: "2025"
    msr_ending_label: "Residential MSRs, carrying value, December 31"
  "2026Q1":
    period_end: "2026-03-31"
    qps_evidence_id: phase3-tfc-2026q1-qps
    periodic_evidence_id: phase3-tfc-2026q1-10q
    rollforward_period_start: "2026-01-01"
    rollforward_period_type: duration_quarter
    rollforward_header: "2026"
    msr_ending_label: "Residential MSRs, carrying value, March 31"
  "2026Q2":
    period_end: "2026-06-30"
    qps_evidence_id: phase3-tfc-2026q2-qps
    periodic_evidence_id: phase3-tfc-2026q2-10q
    rollforward_period_start: "2026-01-01"
    rollforward_period_type: duration_ytd
    rollforward_header: "2026"
    msr_ending_label: "Residential MSRs, carrying value, June 30"

reported_mappings:
  qps_current_period:
    reporting_scope_id: tfc_consolidated_residential_mortgage_servicing
    table_locator: "Selected Mortgage Banking Information & Additional Information > As of/For the Quarter Ended"
    column_index: 0
    unit: USD
    scale: "1000000"
    period_type: instant
    rows:
      - metric_id: servicing_for_others_upb
        raw_label: "Loans serviced for others"
      - metric_id: bank_owned_loans_serviced_upb
        raw_label: "Bank-owned loans serviced"
      - metric_id: total_servicing_upb
        raw_label: "Total servicing portfolio"
      - metric_id: servicing_revenue
        raw_label: "Residential mortgage servicing income before MSR valuation"
        period_type: duration_quarter
      - metric_id: weighted_average_servicing_fee_bps
        raw_label: "Weighted-average servicing fee on mortgage loans serviced for others"
        unit: basis_points
        normalization: percent_to_basis_points

  periodic_current_period:
    reporting_scope_id: tfc_consolidated_residential_mortgage_servicing
    table_locator: "Loan Servicing > Residential Mortgage Activities"
    column_index: 0
    unit: USD
    scale: "1000000"
    period_type: instant
    rows:
      - metric_id: total_servicing_upb
        raw_label: "UPB of residential mortgage loan servicing portfolio"
      - metric_id: servicing_for_others_upb
        raw_label: "UPB of residential mortgage loans serviced for others, primarily agency conforming fixed rate"

  periodic_msr_fair_value:
    reporting_scope_id: tfc_owned_residential_msr
    table_locator: "Loan Servicing > Residential MSR carrying-value roll-forward"
    column_index: 0
    unit: USD
    scale: "1000000"
    period_type: instant
    metric_ids: [msr_fair_value, msr_ending_balance]
    accounting_methodology: FAIR_VALUE
    label_from_period: msr_ending_label
    semantic_note: >-
      Truist states that loan servicing rights are accounted for at fair value;
      the roll-forward's ending carrying value is therefore the residential MSR
      fair value for this exact asset class and date.

  periodic_servicing_fee_income:
    reporting_scope_id: tfc_consolidated_residential_mortgage_servicing
    table_locator: "Loan Servicing > Residential Mortgage Activities"
    unit: USD
    scale: "1000000"
    prohibit_quarter_derivation_from_ytd: true
    reported_periods:
      "2025Q3":
        extraction: bounded_narrative_pattern
        raw_label_prefix: "Servicing fees recognized from mortgage loans serviced for others"
        text_value_pattern: 'Servicing fees recognized from mortgage loans serviced for others were \$(?P<value>[\d,]+) million and \$[\d,]+ million for the three months ended September 30, 2025 and September&#160;30, 2024, respectively\.'
      "2026Q1":
        extraction: exact_table_row
        raw_label: "Servicing fees recognized from mortgage loans serviced for others"
        column_index: 0
    not_disclosed_periods:
      "2025Q4": annual_value_only
      "2026Q2": ytd_value_only

rollforward_components:
  reporting_scope_id: tfc_owned_residential_msr
  table_locator: "Loan Servicing > Residential MSR carrying-value roll-forward"
  column_index: 0
  unit: USD
  scale: "1000000"
  components:
    - metric_id: msr_beginning_balance
      raw_label: "Residential MSRs, carrying value, January 1"
      sign: positive
    - metric_id: msr_purchases
      raw_label: "Acquired"
      sign: positive
      methodology: ISSUER_ACQUIRED
    - metric_id: msr_additions
      raw_label: "Additions"
      sign: positive
    - metric_id: msr_sales
      raw_label: "Sales"
      sign: reduction_magnitude
      dash_policy: PUBLISH_ZERO_ONLY_WHEN_ROW_PRESENTS_EM_DASH
    - metric_id: msr_fair_value_inputs_or_assumptions_change
      raw_label_variants:
        - "Change in fair value due to changes in valuation inputs or assumptions"
        - "Change in fair value due to changes in valuation inputs or assumptions(1)"
      sign: signed
      methodology: ISSUER_COMBINED_VALUATION_INPUTS_OR_ASSUMPTIONS
    - metric_id: msr_realization_passage_time_and_other
      raw_label: "Realization of expected net servicing cash flows, passage of time, and other"
      sign: reduction_magnitude
      methodology: ISSUER_COMBINED_REALIZATION_PASSAGE_TIME_AND_OTHER
  reconciliation:
    formula: beginning + acquired + additions - sales + valuation_change - realization = ending
    include_only_rows_present_in_the_filed_table: true
    tolerance: "0"
    failure_disposition: QUARANTINE
    prohibit_quarter_derivation_from_ytd: true

derived_recipes:
  - metric_id: msr_fair_value_multiple_of_related_upb
    formula_version: "1.0.0"
    numerator_metric_id: msr_fair_value
    denominator_metric_id: servicing_for_others_upb
    formula: numerator / denominator
    required_period_alignment: SAME_INSTANT_DATE
    required_scope_relationship: RESIDENTIAL_MSR_TO_RELATED_SERVICING_FOR_OTHERS
    output_unit: multiple
    quantize: "0.000001"
    rounding: ROUND_HALF_EVEN
    input_observation_ids_required: true
    zero_denominator: REJECT
  - metric_id: msr_fair_value_bps_of_related_upb
    formula_version: "1.0.0"
    numerator_metric_id: msr_fair_value
    denominator_metric_id: servicing_for_others_upb
    formula: (numerator / denominator) * 10000
    required_period_alignment: SAME_INSTANT_DATE
    required_scope_relationship: RESIDENTIAL_MSR_TO_RELATED_SERVICING_FOR_OTHERS
    output_unit: basis_points
    quantize: "0.01"
    rounding: ROUND_HALF_EVEN
    input_observation_ids_required: true
    zero_denominator: REJECT

excluded_candidates:
  - raw_label: "Residential mortgage loans in the process of foreclosure"
    reason_code: OWNED_LOAN_CREDIT_DISCLOSURE_SCOPE_MISMATCH
    note: This is not a servicing-portfolio foreclosure or delinquency measure.
  - raw_label: "Interest rate contracts"
    parent_label: "MSRs and mortgage banking:"
    reason_code: MSR_HEDGE_RESULT_NOT_SEPARATELY_REPORTED
    note: The result combines MSRs with mortgage banking and cannot be published as an MSR-only hedge result.
  - raw_label: "primarily agency conforming fixed rate"
    reason_code: QUALITATIVE_PORTFOLIO_MIX_ONLY
    note: The wording provides no exact agency or investor percentage or UPB split.
