version: "regulatory-mappings-1.0.0"

# RSSD identities are native reporting boundaries. The holding company and its
# insured depository subsidiary are deliberately separate records.
reporters:
  - rssd_id: "1074156"
    company_id: tfc
    legal_name: "Truist Financial Corporation"
    reporting_entity_id: tfc_bhc_regulatory_reporter
    reporting_scope_id: tfc_bhc_regulatory
    reporter_type: BANK_HOLDING_COMPANY
    reporting_scope: BANK_HOLDING_COMPANY_REGULATORY
    permitted_source_families: [FR_Y9C]
    ticker: TFC
    cik: "0000092230"
    parent_rssd_id: null
    valid_from: "2019-12-06"
    valid_to: null
    nic_profile_url: "https://www.ffiec.gov/npw/Institution/Profile/1074156"

  - rssd_id: "852320"
    company_id: tfc
    legal_name: "Truist Bank"
    reporting_entity_id: truist_bank_regulatory_reporter
    reporting_scope_id: truist_bank_regulatory
    reporter_type: INSURED_DEPOSITORY_INSTITUTION
    reporting_scope: DEPOSITORY_INSTITUTION_REGULATORY
    permitted_source_families: [FFIEC_CDR_CALL]
    ticker: null
    cik: null
    parent_rssd_id: "1074156"
    valid_from: "2019-12-07"
    valid_to: null
    nic_profile_url: "https://www.ffiec.gov/npw/Institution/Profile/852320"

sources:
  - family: FFIEC_CDR_CALL
    delimiter: tab
    rssd_column: ID_RSSD
    report_date_column: Reporting Period End Date
    report_date_format: "%Y%m%d"
    revision_column: Last Date/Time Submission Updated On
    source_url: "https://cdr.ffiec.gov/public/PWS/DownloadBulkData.aspx"

  - family: FR_Y9C
    delimiter: caret
    rssd_column: RSSD9001
    report_date_column: REPORT_DATE
    report_date_format: "%Y-%m-%d"
    revision_column: REVISION
    source_url: "https://www.ffiec.gov/npw/FinancialReport/FinancialDataDownload"

# All configured dollar series are reported in thousands. Component labels
# preserve source meaning; they are not authority to blend BHC and bank facts.
