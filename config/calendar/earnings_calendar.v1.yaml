version: "earnings-calendar-1.0.0"

# The expected window uses only prior EDGAR filing lags for the same fiscal
# quarter. Issuer IR announcements are displayed separately and never alter it.
inference:
  method: matching_fiscal_quarter_min_max_filing_lag
  lookback_matching_periods: 3
  minimum_matching_periods: 2
  padding_days: 1
  maximum_lag_days: 120

