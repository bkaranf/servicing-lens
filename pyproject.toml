[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mortgage-servicing-dashboard-foundation"
version = "0.1.0"
description = "Privacy-first LangChain foundation for a future mortgage servicing dashboard"
readme = "README.md"
requires-python = ">=3.11,<4.0"
license = { text = "MIT" }
authors = [{ name = "Mortgage Servicing Dashboard Team" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "deepagents>=0.7.5,<0.8.0",
    "langchain>=1.3.14,<1.4.0",
    "langchain-core>=1.5.3,<2.0.0",
    "langgraph>=1.2.5,<1.3.0",
    "pydantic>=2.12.0,<3.0.0",
    "pydantic-settings>=2.10.0,<3.0.0",
]

[project.scripts]
msd-foundation = "mortgage_servicing_dashboard.cli:main"

[dependency-groups]
dev = [
    "mypy>=2.1.0,<2.2.0",
    "pytest>=9.0.0,<10.0.0",
    "pytest-cov>=7.0.0,<8.0.0",
    "pytest-socket>=0.7.0,<1.0.0",
    "ruff>=0.15.0,<0.17.0",
]

[tool.uv.sources]
langchain = { path = "../libs/langchain_v1", editable = true }
langchain-core = { path = "../libs/core", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/mortgage_servicing_dashboard"]

[tool.pytest.ini_options]
addopts = "--disable-socket --strict-config --strict-markers -q"
testpaths = ["tests/unit_tests"]

[tool.coverage.run]
branch = true
source = ["mortgage_servicing_dashboard"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ANN401", # Framework callbacks intentionally expose dynamic payloads.
    "COM812", # Conflicts with the formatter.
    "CPY",    # Copyright headers are managed at repository level.
    "TC001",  # Runtime imports keep framework-facing annotations inspectable.
    "TC002",  # Runtime imports keep framework-facing annotations inspectable.
    "TC003",  # Runtime imports keep framework-facing annotations inspectable.
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "D",       # Tests describe behavior in their names.
    "PLR2004", # Literal values make assertions easier to read.
    "S101",    # Pytest tests use assertions.
    "S105",    # Synthetic test values exercise secret non-disclosure.
    "SLF001",  # Tests validate private boundary internals where necessary.
]
"src/mortgage_servicing_dashboard/cli.py" = [
    "T201", # Printing is the CLI's deliberate output boundary.
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.11"
strict = true
warn_unreachable = true
