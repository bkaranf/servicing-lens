[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "public-mortgage-servicing-intelligence"
version = "0.1.0"
description = "Source-traceable public mortgage-servicing financial intelligence"
readme = "README.md"
requires-python = ">=3.11,<4.0"
license = { text = "MIT" }
authors = [{ name = "Mortgage Servicing Dashboard Team" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "alembic>=1.17.0,<2.0.0",
    "edgartools==5.48.0",
    "fastapi>=0.116.0,<1.0.0",
    "httpx>=0.28.0,<1.0.0",
    "jinja2>=3.1.0,<4.0.0",
    "psycopg[binary]>=3.2.0,<4.0.0",
    "pydantic>=2.12.0,<3.0.0",
    "pydantic-settings>=2.10.0,<3.0.0",
    "pyyaml>=6.0.0,<7.0.0",
    "sqlalchemy>=2.0.45,<3.0.0",
    "uvicorn>=0.35.0,<1.0.0",
]

[project.scripts]
msi = "mortgage_servicing_dashboard.cli:main"

[dependency-groups]
dev = [
    "mypy>=2.1.0,<2.2.0",
    "pytest>=9.0.0,<10.0.0",
    "pytest-cov>=7.0.0,<8.0.0",
    "pytest-socket>=0.7.0,<1.0.0",
    "ruff>=0.15.0,<0.17.0",
    "types-pyyaml>=6.0.0,<7.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mortgage_servicing_dashboard"]

[tool.hatch.build.targets.wheel.shared-data]
"config/calendar" = "share/public-mortgage-servicing-intelligence/config/calendar"
"config/financial_fields.v1.yaml" = "share/public-mortgage-servicing-intelligence/config/financial_fields.v1.yaml"
"config/metrics/catalog.yaml" = "share/public-mortgage-servicing-intelligence/config/metrics/catalog.yaml"
"config/regulatory" = "share/public-mortgage-servicing-intelligence/config/regulatory"
"config/stage_a_data.yaml" = "share/public-mortgage-servicing-intelligence/config/stage_a_data.yaml"
"config/universe.yaml" = "share/public-mortgage-servicing-intelligence/config/universe.yaml"
"config/xbrl_concepts.yaml" = "share/public-mortgage-servicing-intelligence/config/xbrl_concepts.yaml"
"tests/fixtures/edgartools/golden-sources.v1.yaml" = "share/public-mortgage-servicing-intelligence/config/golden-sources.v1.yaml"
"alembic" = "share/public-mortgage-servicing-intelligence/alembic"

[tool.uv]
constraint-dependencies = ["numpy>=2.4.6,<2.5"]

[tool.pytest.ini_options]
addopts = "--disable-socket --strict-config --strict-markers -q"
testpaths = ["tests/unit_tests"]
markers = [
    "live: opt-in network smoke tests against official public sources",
]

[tool.coverage.run]
branch = true
source = ["mortgage_servicing_dashboard"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ANN401", # Dynamic callbacks intentionally expose dynamic payloads.
    "COM812", # Conflicts with the formatter.
    "CPY",    # Copyright headers are managed at repository level.
    "TC001",  # Runtime imports keep annotations inspectable.
    "TC002",  # Runtime imports keep annotations inspectable.
    "TC003",  # Runtime imports keep annotations inspectable.
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "D",       # Tests describe behavior in their names.
    "PLR2004", # Literal values make assertions easier to read.
    "S101",    # Pytest tests use assertions.
    "S105",    # Synthetic test values exercise secret non-disclosure.
    "SLF001",  # Tests validate private boundary internals where necessary.
]
"src/mortgage_servicing_dashboard/cli.py" = [
    "T201", # Printing is the CLI's deliberate output boundary.
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.11"
strict = true
warn_unreachable = true
